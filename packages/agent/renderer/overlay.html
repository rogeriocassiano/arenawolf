<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Arena Wolf — Sessão</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      font-family: 'Rajdhani', sans-serif;
      -webkit-app-region: no-drag;
      overflow: hidden;
    }

    .widget {
      background: rgba(10, 12, 16, 0.88);
      border: 1px solid rgba(29,111,237,0.35);
      border-radius: 1rem;
      padding: 0.75rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(29,111,237,0.1);
      min-width: 200px;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: 900;
      color: #5b9cf6;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 2s infinite;
    }

    .status-dot.warning { background: #f59e0b; }
    .status-dot.critical { background: #ef4444; }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 currentColor; }
      50% { opacity: 0.7; }
    }

    .timer {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      color: #10b981;
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .timer.warning { color: #f59e0b; }
    .timer.critical { color: #ef4444; animation: blink 0.5s step-end infinite; }

    @keyframes blink { 50% { opacity: 0.5; } }

    .nickname {
      font-size: 0.75rem;
      color: rgba(240,244,255,0.6);
      font-weight: 500;
    }

    .credits-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.1rem;
    }

    .credits-label {
      font-size: 0.65rem;
      color: rgba(240,244,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .credits-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      color: #5b9cf6;
    }

    .end-btn {
      margin-top: 0.4rem;
      width: 100%;
      padding: 0.35rem 0;
      background: rgba(230,57,70,0.15);
      border: 1px solid rgba(230,57,70,0.4);
      border-radius: 0.5rem;
      color: #ef4444;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background 0.15s;
    }
    .end-btn:hover { background: rgba(230,57,70,0.3); }

    .confirm-row {
      display: none;
      flex-direction: column;
      gap: 0.3rem;
      margin-top: 0.3rem;
    }
    .confirm-row.visible { display: flex; }
    .confirm-text { font-size: 0.7rem; color: #ef4444; text-align: center; }
    .confirm-actions { display: flex; gap: 0.35rem; }
    .confirm-yes, .confirm-no {
      flex: 1; padding: 0.3rem 0; border-radius: 0.4rem;
      font-family: 'Rajdhani', sans-serif; font-size: 0.72rem; font-weight: 700;
      cursor: pointer; border: 1px solid;
    }
    .confirm-yes { background: rgba(230,57,70,0.2); border-color: rgba(230,57,70,0.5); color: #ef4444; }
    .confirm-no  { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.15); color: #9ca3af; }
  </style>
</head>
<body>
  <div class="widget">
    <div class="top-row">
      <span class="brand">Arena Wolf</span>
      <div class="status-dot" id="dot"></div>
    </div>
    <div class="timer" id="timer">--:--</div>
    <div class="nickname" id="nickname">Sessão ativa</div>
    <div class="credits-row">
      <span class="credits-label">Créditos:</span>
      <span class="credits-value" id="creditsEl">--</span>
    </div>
    <button class="end-btn" id="endBtn">■ Encerrar Sessão</button>
    <div class="confirm-row" id="confirmRow">
      <span class="confirm-text">Tem certeza?</span>
      <div class="confirm-actions">
        <button class="confirm-no" id="confirmNo">Cancelar</button>
        <button class="confirm-yes" id="confirmYes">Encerrar</button>
      </div>
    </div>
  </div>

  <script>
    const timerEl = document.getElementById('timer');
    const dotEl = document.getElementById('dot');
    const nicknameEl = document.getElementById('nickname');

    const creditsEl = document.getElementById('creditsEl');

    function formatTime(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      return h > 0
        ? `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
        : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function formatCredits(minutes) {
      if (!minutes && minutes !== 0) return '--';
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      if (h > 0 && m > 0) return `${h}h ${m}min`;
      if (h > 0) return `${h}h`;
      return `${m}min`;
    }

    document.getElementById('endBtn').addEventListener('click', () => {
      document.getElementById('confirmRow').classList.add('visible');
      document.getElementById('endBtn').style.display = 'none';
    });
    document.getElementById('confirmNo').addEventListener('click', () => {
      document.getElementById('confirmRow').classList.remove('visible');
      document.getElementById('endBtn').style.display = 'block';
    });
    document.getElementById('confirmYes').addEventListener('click', async () => {
      await window.agent.endSession();
    });

    window.agent.onTick(({ remaining, session }) => {
      timerEl.textContent = formatTime(remaining);

      const isCritical = remaining < 120;
      const isWarning = remaining < 600;

      timerEl.className = 'timer' + (isCritical ? ' critical' : isWarning ? ' warning' : '');
      dotEl.className = 'status-dot' + (isCritical ? ' critical' : isWarning ? ' warning' : '');

      if (session) {
        if (session.nickname) nicknameEl.textContent = session.nickname;
        if (session.creditsMinutes !== undefined) {
          creditsEl.textContent = formatCredits(session.creditsMinutes);
        }
      }
    });
  </script>
</body>
</html>
